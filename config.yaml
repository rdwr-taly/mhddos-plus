# -----------------------------------------------------------------------------
# Container Control Core v2.0 Configuration for MHDDoS Plus
# -----------------------------------------------------------------------------

# --- Adapter Configuration (Required) ---
adapter:
  class: mhddos_adapter.MhDosAdapter
  primary_payload_key: sub_tasks
  run_as_user: mhddos_user

# --- Core Process Management (Optional Service) ---
# Let the core handle process lifecycle for simple attack tasks
process_management:
  enabled: false  # We'll handle complex multi-task logic in the adapter

# --- Core Metrics Service (Optional Service) ---
# Let the core collect network and system metrics automatically
metrics:
  network_monitoring:
    enabled: true
    interface: "eth0"
  process_monitoring:
    enabled: false  # Not applicable since we manage our own processes

# --- Core Traffic Control (Optional Service) ---  
# Let the core manage network shaping using tc
traffic_control:
  enabled: true
  interface: "eth0"
  bandwidth_mbps_key: "throughput_in_mbps"
  default_bandwidth_mbps: 10
  latency_ms_key: "latency_in_ms" 
  # tc rejects latency=0 so use a small positive default
  default_latency_ms: 1
