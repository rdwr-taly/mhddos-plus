name: Release Docker Image on Version Branch

on:
  push:
    branches:
      - 'v*.*.*'

jobs:
  release:
    if: ${{ github.event.before != '0000000000000000000000000000000000000000' }}
    runs-on: ubuntu-latest
    
    # Define environment variables for the job
    env:
      # Reads the variable you created in the repository settings.
      # This makes the image name easily configurable without editing the file.
      DOCKER_IMAGE_NAME: ${{ vars.DOCKER_IMAGE_NAME }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Prepare Docker tags
        id: prep_tags
        run: |
          CURRENT_VERSION=${GITHUB_REF#refs/heads/}
          LATEST_TAG=$(git tag | sort -V | tail -n 1)
          
          echo "Current version: ${CURRENT_VERSION}"
          echo "Latest tag found: ${LATEST_TAG}"
          
          # Use the environment variable for the image name
          TAGS="${DOCKER_IMAGE_NAME}:${CURRENT_VERSION#v}"
          
          if [[ "${CURRENT_VERSION}" == "${LATEST_TAG}" ]]; then
            echo "✅ This is the latest version. Adding 'latest' tag."
            # Use the environment variable here as well
            TAGS="${TAGS}\n${DOCKER_IMAGE_NAME}:latest"
          else
            echo "☑️ This is not the latest version. Skipping 'latest' tag."
          fi
          
          echo "tags<<EOF" >> $GITHUB_OUTPUT
          echo "${TAGS}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build & push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.prep_tags.outputs.tags }}
